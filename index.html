<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogro Team - Sistema de Gestão</title>
    <!-- Estilização Direta Embutida para Garantir o Modo Escuro e Organização -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 412px; background-color: #111827; display: flex; flex-col; flex-direction: column; justify-content: space-between; border-left: 1px solid #1f2937; border-right: 1px solid #1f2937; min-height: 100vh; position: relative; }
        header { background-color: #000000; padding: 16px; display: flex; flex-direction: column; align-items: center; border-b: 1px solid #7f1d1d; border-bottom: 2px solid rgba(127, 29, 29, 0.4); }
        .logo-box { width: 150px; height: 150px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .slogan { font-size: 11px; font-weight: 900; letter-spacing: 0.15em; color: #ef4444; text-transform: uppercase; background-color: rgba(127, 29, 29, 0.3); padding: 4px 12px; border-radius: 9999px; border: 1px solid rgba(185, 28, 28, 0.3); }
        main { flex: 1; padding: 16px; overflow-y: auto; }
        .tab-title-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .tab-title { font-size: 12px; font-weight: 700; text-transform: uppercase; tracking-spacing: 0.05em; color: #9ca3af; letter-spacing: 0.05em; }
        .badge-count { font-size: 11px; background-color: rgba(127, 29, 29, 0.5); border: 1px solid rgba(153, 27, 27, 0.4); padding: 2px 8px; border-radius: 4px; color: #f87171; font-family: monospace; }
        .list-space { display: flex; flex-direction: column; gap: 12px; }
        .card-atleta { background-color: #1f2937; border: 1px solid #374151; padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .atleta-nome { font-weight: 700; color: #ffffff; font-size: 15px; margin-bottom: 4px; }
        .atleta-sub { font-size: 12px; color: #9ca3af; display: flex; align-items: center; gap: 4px; }
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 900; letter-spacing: 0.05em; }
        .status-emdia { background-color: #064e3b; color: #34d399; border: 1px solid #047857; }
        .status-atrasado { background-color: #7f1d1d; color: #f87171; border: 1px solid #b91c1c; }
        .btn-checkin { background-color: #dc2626; color: white; border: none; font-size: 12px; font-weight: 900; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .btn-checkin:active { transform: scale(0.95); background-color: #b91c1c; }
        .card-financeiro { background-color: #1f2937; border: 1px solid #374151; padding: 14px; border-radius: 12px; display: flex; flex-direction: column; }
        .fin-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .venc-text { font-size: 12px; color: #9ca3af; margin-top: 4px; }
        .venc-data { font-family: monospace; color: #e5e7eb; font-weight: 600; }
        .fin-actions { display: flex; gap: 8px; border-top: 1px solid #374151; padding-top: 12px; }
        .btn-toggle-fin { flex: 1; background-color: #374151; color: #e5e7eb; border: none; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }
        .btn-cobrar { background-color: #15803d; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        nav { background-color: #000000; border-top: 1px solid #1f2937; display: flex; justify-content: space-around; padding: 12px; }
        .nav-btn { background: none; border: none; color: #6b7280; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 11px; font-weight: 600; width: 33%; }
        .nav-btn.active { color: #dc2626; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Cabeçalho com Imagem e Slogan Desejado -->
        <header>
            <div class="logo-box">
                <img src="logo.png" alt="Ogro Team Logo">
            </div>
            <span class="slogan">Escola de Campeões</span>
        </header>

        <!-- Telas do Sistema -->
        <main id="app-content"></main>

        <!-- Menu de Navegação Inferior Resistente -->
        <nav>
            <button onclick="switchTab('alunos')" id="nav-alunos" class="nav-btn active">
                <div class="nav-icon">👤</div>
                <span>Alunos</span>
            </button>
            <button onclick="switchTab('chamada')" id="nav-chamada" class="nav-btn">
                <div class="nav-icon">📝</div>
                <span>Chamada</span>
            </button>
            <button onclick="switchTab('financeiro')" id="nav-financeiro" class="nav-btn">
                <div class="nav-icon">💰</div>
                <span>Financeiro</span>
            </button>
        </nav>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('ogroteam_db')) || {
            alunos: [
                { id: 1, nome: "Carlos Silva", telefone: "5521999999999", vencimento: "2026-05-10", status: "Em dia", presencas: 12 },
                { id: 2, nome: "Bruno Ramos", telefone: "5521988888888", vencimento: "2026-05-01", status: "Inadimplente", presencas: 8 },
                { id: 3, nome: "Amanda Costa", telefone: "5521977777777", vencimento: "2026-05-25", status: "Em dia", presencas: 20 }
            ]
        };
        let currentTab = 'alunos';

        function verificarPrazos() {
            const hoje = new Date();
            db.alunos.forEach(aluno => {
                const dataVenc = new Date(aluno.vencimento);
                if (hoje > dataVenc && aluno.status !== 'Inadimplente') {
                    aluno.status = 'Inadimplente';
                }
            });
            saveDB();
        }

        function saveDB() { localStorage.setItem('ogroteam_db', JSON.stringify(db)); }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-' + tab).classList.add('active');
            render();
        }

        function registrarPresenca(id) {
            const aluno = db.alunos.find(a => a.id === id);
            if (aluno.status === 'Inadimplente') {
                alert("❌ ACESSO NEGADO para " + aluno.nome + ".\n\nMotivo: Mensalidade vencida. Regularize o caixa com o mestre para poder treinar.");
                return;
            }
            aluno.presencas += 1;
            saveDB();
            alert("🥋 CHECK-IN CONFIRMADO!\n\n" + aluno.nome + " está liberado para o treino. OSS!");
            render();
        }

        function alternarStatusFinanceiro(id) {
            const aluno = db.alunos.find(a => a.id === id);
            if (aluno.status === 'Em dia') {
                aluno.status = 'Inadimplente';
            } else {
                aluno.status = 'Em dia';
                let data = new Date();
                data.setMonth(data.getMonth() + 1);
                aluno.vencimento = data.toISOString().split('T')[0]; 
            }
            saveDB();
            render();
        }

        function enviarCobranca(id) {
            const aluno = db.alunos.find(a => a.id === id);
            const msg = "Olá, " + aluno.nome + "! 🥋 Vimos que sua mensalidade da OGRO TEAM consta em aberto e o check-in do tatame foi pausado automaticamente. Realize o pagamento para liberar seu acesso. Chave PIX: pix@ogroteam.com. OSS!";
            window.open("https://whatsapp.com" + aluno.telefone + "&text=" + encodeURIComponent(msg), '_blank');
        }

        function formatarData(dataStr) {
            const partes = dataStr.split('-');
            return partes[2] + '/' + partes[1] + '/' + partes[0];
        }

        function render() {
            const content = document.getElementById('app-content');
            if (currentTab === 'alunos') {
                content.innerHTML = '<div class="tab-title-container"><h2 class="tab-title">Plantel Ogro Team</h2><span class="badge-count">' + db.alunos.length + ' Atletas</span></div><div class="list-space">' + db.alunos.map(a => '<div class="card-atleta"><div><h3 class="atleta-nome">' + a.nome + '</h3><p class="atleta-sub">🔥 ' + a.presencas + ' treinos concluídos</p></div><span class="status-badge ' + (a.status === 'Em dia' ? 'status-emdia' : 'status-atrasado') + '">' + a.status.toUpperCase() + '</span></div>').join('') + '</div>';
            }
            if (currentTab === 'chamada') {
                content.innerHTML = '<div class="tab-title-container"><h2 class="tab-title">Frequência Diária</h2></div><div class="list-space">' + db.alunos.map(a => '<div class="card-atleta"><div><h3 class="atleta-nome">' + a.nome + '</h3><p class="atleta-sub ' + (a.status === 'Em dia' ? 'text-green-400' : 'text-red-400') + '" style="font-weight:bold; color:' + (a.status === 'Em dia' ? '#34d399' : '#f87171') + '">' + a.status + '</p></div><button onclick="registrarPresenca(' + a.id + ')" class="btn-checkin">OSSO!</button></div>').join('') + '</div>';
            }
            if (currentTab === 'financeiro') {
                content.innerHTML = '<div class="tab-title-container"><h2 class="tab-title">Controle de Caixa</h2></div><div class="list-space">' + db.alunos.map(a => '<div class="card-financeiro"><div class="fin-row"><div><h3 class="atleta-nome">' + a.nome + '</h3><p class="venc-text">Vencimento: <span class="venc-data">' + formatarData(a.vencimento) + '</span></p></div><span class="status-badge ' + (a.status === 'Em dia' ? 'status-emdia' : 'status-atrasado') + '">' + a.status + '</span></div><div class="fin-actions"><button onclick="alternarStatusFinanceiro(' + a.id + ')" class="btn-toggle-fin">' + (a.status === 'Em dia' ? 'Marcar Atraso' : 'Confirmar Pgto') + '</button>' + (a.status === 'Inadimplente' ? '<button onclick="enviarCobranca(' + a.id + ')" class="btn-cobrar">💬 Cobrar</button>' : '') + '</div></div>').join('') + '</div>';
            }
        }
        verificarPrazos();
        render();
    </script>
</body>
</html>
